name: Build and deploy .NET app to Azure Web App - language-app-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set up .NET version
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore ./LanguageApp.Dotnet.csproj -r linux-x64

      - name: Build
        run: dotnet build ./LanguageApp.Dotnet.csproj --configuration Release --no-restore -r linux-x64

      - name: Publish
        run: dotnet publish ./LanguageApp.Dotnet.csproj --configuration Release --no-build --output ./publish -r linux-x64 --self-contained false

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-app
          path: | 
            ./publish
            !./publish/Resources/**

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v7
        with:
          name: dotnet-app

      - name: Login to Azure
        uses: azure/login@v3
        with:
          creds: ${{ secrets.LANGUAGE_APP_API_AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'language-app-api'
          slot-name: 'Production'