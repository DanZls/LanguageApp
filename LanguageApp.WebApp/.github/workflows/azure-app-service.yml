name: Build and deploy Angular app to Azure Web App - language-app

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx ng build --configuration production

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: ./dist/language-app/browser

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: angular-app
          path: ./ready-to-deploy

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.LANGUAGE_APP_AZURE_CREDENTIALS }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'language-app'
          slot-name: 'Production'
          package: './ready-to-deploy'
          startup-command: 'pm2 serve /home/site/wwwroot --no-daemon --spa'
